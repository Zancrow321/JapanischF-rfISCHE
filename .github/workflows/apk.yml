name: Android-APK bauen

# Baut die App als APK zum Selbst-Installieren auf Android-Handys.
# Die fertige APK liegt danach in diesem Workflow-Lauf unter "Artifacts".
on:
  push:
    branches: ['etappe-*', main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Android-Projekt erzeugen
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: APK bauen
        working-directory: android
        # Nur für heutige Handys (arm64), das spart viel Bauzeit.
        # Signiert mit dem Test-Schlüssel aus der Expo-Vorlage: reicht zum Selbst-Installieren.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: APK umbenennen
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/japanisch-lernen-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: japanisch-lernen-apk
          path: out/*.apk
          retention-days: 30
